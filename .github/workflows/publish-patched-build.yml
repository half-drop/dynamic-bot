name: Publish patched build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-patched-build.yml
      - docker/entrypoint.sh
      - packaging/Dockerfile.prebuilt
      - src/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew ./scripts/*.sh
          ./gradlew --no-daemon test fatJar

      - name: Package and validate prebuilt artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.0.8-halfdrop.3"
          JAR_FILE="$(ls build/libs/*-all.jar | head -n 1)"
          mkdir -p release

          cp "$JAR_FILE" "release/dynamic-bot-${VERSION}-all.jar"
          INCLUDE_JRE_PACKAGES=false ./scripts/package-release.sh "$VERSION" "$JAR_FILE" release

          rm -rf docker-dropin verify-dropin permission-fixture
          mkdir -p docker-dropin
          cp "$JAR_FILE" docker-dropin/dynamic-bot.jar
          cp packaging/Dockerfile.prebuilt docker-dropin/Dockerfile
          cp docker/entrypoint.sh docker-dropin/entrypoint.sh
          cp plugins/catalog.json docker-dropin/catalog.json

          cat > docker-dropin/.dockerignore <<'EOF'
          config/
          data/
          logs/
          plugins/
          docker/
          src/
          gradle/
          build/
          .gradle/
          .git/
          *.kt
          *.kts
          EOF

          cat > docker-dropin/README-覆盖说明.txt <<'EOF'
          这是已经编译好的 dynamic-bot Docker 覆盖包。

          用法：
          1. 将本 ZIP 里的所有文件直接解压/复制到 D:\Wise_G\dynamic-bot，允许覆盖同名文件。
          2. 本包所有 Docker 构建必需文件都在根目录。
          3. 不要删除原来的 config、data、logs、plugins 运行数据。
          4. 双击 apply-update.bat。

          halfdrop.3 额外修复旧 bind mount 内已有 main.yml / dynamic-bot.log 文件权限不属于 1000:1000 时的启动失败。
          Dockerfile 会直接 COPY 已编译好的 dynamic-bot.jar，不会在你的电脑上执行 Gradle。
          EOF

          printf '%s\r\n' \
            '@echo off' \
            'setlocal' \
            'chcp 65001 >nul' \
            'cd /d "%~dp0"' \
            'if not exist "dynamic-bot.jar" (echo [ERROR] dynamic-bot.jar missing.& pause & exit /b 1)' \
            'if not exist "entrypoint.sh" (echo [ERROR] entrypoint.sh missing.& pause & exit /b 1)' \
            'if not exist "catalog.json" (echo [ERROR] catalog.json missing.& pause & exit /b 1)' \
            'if not exist "Dockerfile" (echo [ERROR] Dockerfile missing.& pause & exit /b 1)' \
            'docker info >nul 2>nul || (echo [ERROR] Docker is not running.& pause & exit /b 1)' \
            'for %%I in ("%~dp0..") do set "DEPLOY_DIR=%%~fI"' \
            'if not exist "%DEPLOY_DIR%\docker-compose.yml" if not exist "%DEPLOY_DIR%\compose.yml" (echo [ERROR] compose file not found in %DEPLOY_DIR%.& pause & exit /b 1)' \
            'cd /d "%DEPLOY_DIR%"' \
            'docker compose build --pull dynamic-bot || goto :fail' \
            'docker compose up -d --no-deps dynamic-bot || goto :fail' \
            'docker compose ps dynamic-bot' \
            'echo.' \
            'echo [OK] dynamic-bot updated from prebuilt release.' \
            'pause' \
            'exit /b 0' \
            ':fail' \
            'echo.' \
            'echo [FAILED] dynamic-bot update failed.' \
            'pause' \
            'exit /b 1' \
            > docker-dropin/apply-update.bat

          ZIP="release/dynamic-bot-v${VERSION}-docker-dropin.zip"
          (cd docker-dropin && zip -qr "../$ZIP" .)

          mkdir -p verify-dropin
          unzip -q "$ZIP" -d verify-dropin
          test -s verify-dropin/dynamic-bot.jar
          test -f verify-dropin/Dockerfile
          test -f verify-dropin/entrypoint.sh
          test -f verify-dropin/catalog.json
          test -f verify-dropin/apply-update.bat
          test -f verify-dropin/.dockerignore

          # Gate 1: prove the exact extracted ZIP is a valid Docker build context.
          docker build -t dynamic-bot-dropin-selftest:latest verify-dropin

          # Gate 2: reproduce the Windows-upgrade failure pattern. The bind-mounted
          # directories are writable, but existing files are owned by another UID
          # and mode 0600. The entrypoint must repair them before dropping to UID 1000.
          mkdir -p permission-fixture/config permission-fixture/logs permission-fixture/data permission-fixture/plugins
          printf 'webAdmin:\n  enabled: true\n' > permission-fixture/config/main.yml
          printf 'old log\n' > permission-fixture/logs/dynamic-bot.log
          chmod 0777 permission-fixture/config permission-fixture/logs permission-fixture/data permission-fixture/plugins
          chmod 0600 permission-fixture/config/main.yml permission-fixture/logs/dynamic-bot.log

          docker run --rm \
            -v "$PWD/permission-fixture/config:/app/config" \
            -v "$PWD/permission-fixture/logs:/app/logs" \
            -v "$PWD/permission-fixture/data:/app/data" \
            -v "$PWD/permission-fixture/plugins:/app/plugins" \
            dynamic-bot-dropin-selftest:latest \
            sh -c 'test -r /app/config/main.yml && test -w /app/config/main.yml && test -w /app/logs/dynamic-bot.log && printf "permission-selftest-ok\n" >> /app/logs/dynamic-bot.log'

          # The container intentionally chowns the bind-mounted file to UID 1000,
          # so the GitHub runner user may no longer be allowed to read mode-0600 file.
          sudo grep -q 'permission-selftest-ok' permission-fixture/logs/dynamic-bot.log

          cd release
          sha256sum dynamic-bot-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.0.8-halfdrop.3"
          TITLE="dynamic-bot v0.0.8-halfdrop.3"
          NOTES=$'half-drop 修复构建版。\n\n修复内容：\n- Bilibili hdslb.com HTTP 图片地址自动升级 HTTPS，规避封面下载 EOF。\n- Docker/OneBot 签名链接 AUTO 优先使用 signedUrl.publicBaseUrl，避免先探测 127.0.0.1:2233。\n- Docker 覆盖包使用预编译 JAR，Release 前实际解压并 docker build。\n- 修复旧 bind mount 中 config/main.yml、logs/dynamic-bot.log 等已有文件仍属于旧 owner 时，目录虽然可写但 Java 读取/追加文件 Permission denied 的问题。\n- CI 新增权限回归测试：构造可写目录 + 0600 旧文件，验证 entrypoint 会修复后再降权到 UID 1000。\n\nDocker 用户下载 dynamic-bot-v0.0.8-halfdrop.3-docker-dropin.zip，覆盖 D:\\Wise_G\\dynamic-bot 后运行 apply-update.bat。config/data/logs 不在覆盖包中。'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
